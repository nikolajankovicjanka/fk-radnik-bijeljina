services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fk_radnik_app
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
    networks:
      - fknet

  nginx:
    image: nginx:alpine
    container_name: fk_radnik_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fknet

  db:
    image: mysql:8.0
    container_name: fk_radnik_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: fk_radnik
      MYSQL_USER: fkuser
      MYSQL_PASSWORD: fkpass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - fk_db_data:/var/lib/mysql
    networks:
      - fknet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fk_radnik_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - fknet

networks:
  fknet:

volumes:
  fk_db_data:
